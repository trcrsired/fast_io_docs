    <h1>第3.1章: 空语句</h1>

    <section>
      <h2>语句回顾</h2>
      <p>
        在 C++ 中，<strong>语句</strong>以分号结尾。
        最简单的语句就是：
      </p>

      <pre><code>;</code></pre>

      <p>
        这被称为<strong>空语句</strong>。
        它什么也不做，但依然是合法的。
      </p>
    </section>

    <section>
    <h2>要点</h2>
    <ul>
        <li><strong>语句以 <code>;</code> 结束：</strong>每条 C++ 语句都必须以分号结尾。</li>
        <li><strong>空语句：</strong>单独一个 <code>;</code> 是合法的语句，什么也不做。</li>
        <li><strong>仍有意义：</strong>空语句有时会出现在循环里，或者因失误而出现。</li>
    </ul>
    </section>
