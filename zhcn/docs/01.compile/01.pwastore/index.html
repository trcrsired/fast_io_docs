<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第1.1章: PWA 应用商店 - 使用 fast_io 学习 C++ 教程</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/webp" href="/icons/logo.webp">
</head>
<body>
  <main>
    <h1>第1.1章: PWA 应用商店</h1>

    <section>
      <p>
        在此打开 PWA 应用商店：
        <a href="https://pwa-store-7x5.pages.dev/" target="_blank" rel="noopener noreferrer">
          https://pwa-store-7x5.pages.dev/
        </a>
      </p>
      <p>
        我们使用 <strong>Microsoft Edge</strong> 作为浏览器，因为它在
        Windows、macOS、Android 和 Linux 上提供了最好的 PWA 支持。
      </p>
      <p>
        本文档本身也是一个 <strong>PWA</strong>，并且可以在 PWA 应用商店中找到。
      </p>
    </section>

    <section>
      <h2>安装</h2>
      <p>
        在 Edge 中打开 PWA 应用商店后，看向<strong>地址栏右侧</strong>。
        点击 <strong>“安装应用”</strong> 按钮即可安装。
      </p>

      <div class="screenshots">
        <figure>
          <img src="/docs/01.compile/01.pwastore/01.webp" alt="步骤 1：在 Microsoft Edge 中打开 PWA 应用商店">
          <figcaption>步骤 1：在 Microsoft Edge 中打开 PWA 应用商店。</figcaption>
        </figure>
        <figure>
          <img src="/docs/01.compile/01.pwastore/02.webp" alt="步骤 2：在 Edge 中点击“安装应用”按钮">
          <figcaption>步骤 2：点击地址栏右侧的“安装应用”按钮。</figcaption>
        </figure>
        <figure>
          <img src="/docs/01.compile/01.pwastore/03.webp" alt="步骤 3：PWA 应用商店已作为应用安装">
          <figcaption>步骤 3：PWA 应用商店已安装，并作为独立应用运行。</figcaption>
        </figure>
      </div>
    </section>

    <script src="/sw-register.js"></script>
